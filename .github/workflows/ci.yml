name: Quality gates
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/core.js
      - run: node --check assets/js/app.js
      - run: node --test tests/core.test.cjs tests/checklist.test.mjs
      - run: node -e "require('./assets/js/core.js').records(require('./tasks.json'))"
      - run: node --check sw.js
  browser:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.52.0 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-report
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: planner-previews
          path: planner-previews/
          if-no-files-found: error
