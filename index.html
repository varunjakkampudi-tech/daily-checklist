'use strict';const $=id=>document.getElementById(id),KEY='daily-checklist:v1',categories=['Work','Content','Personal','Finance','Business','Other'],priorities=['Normal','High','Low'];let tasks=[],filter='pending',editing=null;const SEEN=KEY+':seen';let seen=new Set();let loadedLocal=true;try{const ids=JSON.parse(localStorage.getItem(SEEN)||'[]');if(Array.isArray(ids))seen=new Set(ids.filter(x=>typeof x==='string'))}catch{}function valid(x){return x&&typeof x.id==='string'&&typeof x.title==='string'&&x.title.trim()&&x.title.length<=240&&categories.includes(x.category)&&priorities.includes(x.priority)&&typeof x.done==='boolean'}function decode(s){const a=JSON.parse(s);if(!Array.isArray(a)||a.length>500||!a.every(valid)||new Set(a.map(t=>t.id)).size!==a.length)throw Error('Invalid checklist');return a}try{tasks=decode(localStorage.getItem(KEY)||'[]');tasks.forEach(t=>seen.add(t.id));document.body.classList.toggle('dark',isNight())}catch{loadedLocal=false;$('sync').textContent='Could not restore your checklist.'}function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));localStorage.setItem(SEEN,JSON.stringify([...seen]));return true}catch{$('notice').textContent='Storage unavailable. Export a backup.';return false}}function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}function makeIcon(cat){const paths={Work:'M4 7h16v13H4z M9 7V4h6v3 M4 12h16',Content:'M4 5h16v14H4z M10 9l5 3-5 3z',Personal:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M4 21v-2a8 8 0 0 1 16 0v2',Finance:'M3 6h18v14H3z M3 10h18 M16 15h2',Business:'M4 21V7l8-4 8 4v14 M9 21v-5h6v5 M8 10h2 M14 10h2',Other:'M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z'};const w=el('span','category-icon');const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');const p=document.createElementNS(s.namespaceURI,'path');for(const [k,v] of Object.entries({d:p '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m14 5 5 5M4 20l4-1 12-12-5-5L3 14z"/></svg>';edit.onclick=()=>{editing=t.id;$('manage').open=true;$('form-heading').textContent='Edit task';$('cancel-edit').hidden=false;$('title').value=t.title;$('category').value=t.category;$('priority').value=t.priority;$('form').querySelector('button').textContent='Save changes';$('title').focus()};const del=el('button','icon');del.setAttribute('aria-label','Delete '+t.title);del.title='Delete task';del.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/></svg>';del.onclick=()=>{if(confirm('Delete this task?')){seen.add(t.id);tasks=tasks.filter(x=>x.id!==t.id);if(editing===t.id)reset();save();render()}};row.append(toggle,edit,del);body.append(row)}}}let celebrationTimer;function celebrate(all,ok){const toast=$('celebration');clearTimeout(celebrationTimer);toast.classList.remove('show','milestone');void toast.offsetWidth;toast.querySelector('.celebration-text').textContent=all?'All tasks completed!':'Task completed';if(!ok)toast.querySelector('.celebration-text').textContent='Completed · changes not saved';toast.classList.toggle('milestone',all&&ok);toast.classList.add('show');celebrationTimer=setTimeout(()=>toast.classList.remove('show','milestone'),2200)}function reset(){editing=null;$('form-heading').textContent='New task';$('cancel-edit').hidden=true;$('form').reset();$('form').querySelector('button').textContent='Add task'}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});$('form').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title)return;const data={title,category:$('category').value,priority:$('priority').value};if(editing){const t=tasks.find(x=>x.id===editing);if(t)Object.assign(t,data)}else{if(tasks.length>=500){$('notice').textContent='Maximum 500 tasks.';return}tasks.push({id:crypto.randomUUID(),...data,done:false})}reset();save();render()};$('cancel-edit').onclick=reset;function isNight(){const hour=new Date().getHours();return hour<6||hour>=18}let manualPeriod=null;function applyAutoTheme(){const night=isNight();if(manualPeriod!==night){manualPeriod=null;document.body.classList.toggle('dark',night)}themeIcon()}function themeIcon(){const dark=document.body.classList.contains('dark');$('theme').innerHTML=!dark?"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2m0 16v2M2 12h2m16 0h2M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2\"/></svg>":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 15.5A8.7 8.7 0 0 1 8.5 4 8.8 8.8 0 1 0 20 15.5Z\"/></svg>";$('theme').setAttribute('aria-label',dark?'Night mode. Switch to light mode':'Day mode. Switch to dark mode')}applyAutoTheme();setInterval(applyAutoTheme,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)applyAutoTheme()});window.addEventListener('pageshow',applyAutoTheme);$('theme').onclick=()=>{manualPeriod=isNight();document.body.classList.toggle('dark');themeIcon()};$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='checklist.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;if(f.size>1000000)throw Error('File too large');
