<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c31"><meta name="apple-mobile-web-app-capable" content="yes"><title>Daily • Personal Planner</title><style>
:root{color-scheme:light dark;--bg:#f3f5fa;--panel:#fff;--ink:#142039;--muted:#65748b;--line:#e0e5ee;--accent:#087f68}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}body.dark{--bg:#0d1422;--panel:#172235;--ink:#e9efff;--muted:#a7b5cc;--line:#314058;--accent:#45d7ad}main{max-width:680px;margin:auto;padding:24px 16px max(40px,env(safe-area-inset-bottom))}header{background:linear-gradient(135deg,#101c31,#243c58);color:#fff;border-radius:28px;padding:24px;box-shadow:0 14px 32px #101c3124}.top,.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:#bacce3}h1{font-size:32px;letter-spacing:-1.5px;margin:8px 0 20px}h2{font-size:15px;margin:24px 0 8px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#ffffff14;border:1px solid #ffffff19;border-radius:16px;padding:12px}.stat strong{font-size:28px;display:block;line-height:1.2}.stat small{color:#d0dbea}progress{width:100%;height:9px;appearance:none;border:0;border-radius:99px;overflow:hidden;background:#ffffff24}progress::-webkit-progress-bar{background:#ffffff24}progress::-webkit-progress-value{background:#4be0b2}progress::-moz-progress-bar{background:#4be0b2}button,input,select{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid var(--line);border-radius:13px;padding:9px 13px;background:var(--panel);color:var(--ink);font-weight:600}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #559bff;outline-offset:2px}.primary{background:var(--accent);color:#fff;border:0}.dark .primary{color:#10291e}.tabs{display:flex;gap:6px;margin:20px 0; padding:5px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.tabs button{flex:1;border:0;background:transparent;color:var(--muted)}.tabs button[aria-pressed=true]{background:var(--bg);color:var(--ink)}.task{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;margin:8px 0;box-shadow:0 3px 8px #00000005}.toggle{flex:1;display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:0;padding:4px;overflow-wrap:anywhere}.circle{flex:none;display:grid;place-items:center;width:27px;height:27px;border:2px solid var(--muted);border-radius:50%;color:var(--accent)}.done .circle{border-color:var(--accent)}.done .label{text-decoration:line-through;color:var(--muted)}.label{font-weight:600}.sub{display:block;color:var(--muted);font-size:12px;font-weight:400}.icon{font-size:13px;min-width:44px}.form{display:grid;gap:10px;background:var(--panel);padding:16px;border:1px solid var(--line);border-radius:20px}input,select{min-height:46px;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px} .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty{text-align:center;padding:32px 16px;color:var(--muted)}footer{color:var(--muted);font-size:12px;margin-top:24px}.tools{display:flex;flex-wrap:wrap;gap:8px}header button{background:#ffffff12;color:white;border-color:#ffffff30}dialog{max-width:90vw;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:20px}dialog::backdrop{background:#0008} @media(prefers-reduced-motion:no-preference){button{transition:background .15s}} </style></head>
<body><main><header><div class="top"><span class="eyebrow">PERSONAL COMMAND CENTER</span><button id="theme" aria-label="Toggle theme">Theme</button></div><h1>Daily Checklist</h1><div class="stats"><div class="stat"><strong id="total">0</strong><small>Total</small></div><div class="stat"><strong id="done">0</strong><small>Completed</small></div><div class="stat"><strong id="pending">0</strong><small>Pending</small></div></div><p class="between"><span>Progress</span><strong id="percent">0%</strong></p><progress id="progress" value="0" max="100" aria-label="Completion progress"></progress></header>
<nav class="tabs" aria-label="Task filter"><button data-filter="pending" aria-pressed="true">Pending</button><button data-filter="done" aria-pressed="false">Completed</button><button data-filter="all" aria-pressed="false">All</button></nav><div id="list"></div><h2>Add a task</h2><form id="form" class="form"><input id="title" required maxlength="240" placeholder="What needs to be done?" aria-label="Task title"><div class="fields"><select id="category" aria-label="Category"><option>Work</option><option>Content</option><option>Personal</option><option>Finance</option><option>Business</option><option>Other</option></select><select id="priority" aria-label="Priority"><option>Normal</option><option>High</option><option>Low</option></select></div><button class="primary" type="submit">Add task</button></form><h2>Data & settings</h2><div class="tools"><button id="export">Export checklist</button><button id="import">Import checklist</button><input hidden type="file" id="file" accept="application/json,.json"></div><p id="notice" role="status" aria-live="polite"></p><footer>Private on this browser. No account, tracking or cloud synchronization. Export a backup before clearing browser data.</footer></main>
<script>
'use strict';const $=id=>document.getElementById(id),KEY='daily-checklist:v1',categories=['Work','Content','Personal','Finance','Business','Other'],priorities=['Normal','High','Low'];let tasks=[],filter='pending',editing=null;function valid(x){return x&&typeof x.id==='string'&&typeof x.title==='string'&&x.title.trim()&&x.title.length<=240&&categories.includes(x.category)&&priorities.includes(x.priority)&&typeof x.done==='boolean'}function decode(s){const a=JSON.parse(s);if(!Array.isArray(a)||a.length>500||!a.every(valid)||new Set(a.map(t=>t.id)).size!==a.length)throw Error('Invalid checklist');return a}try{tasks=decode(localStorage.getItem(KEY)||'[]');document.body.classList.toggle('dark',localStorage.getItem(KEY+':theme')==='dark')}catch{ $('notice').textContent='Saved data could not be loaded.'}function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));return true}catch{$('notice').textContent='Storage unavailable. Export a backup.';return false}}function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}function render(){const n=tasks.length,d=tasks.filter(t=>t.done).length,p=n?Math.round(d/n*100):0;$('total').textContent=n;$('done').textContent=d;$('pending').textContent=n-d;$('percent').textContent=p+'%';$('progress').value=p;const list=$('list');list.replaceChildren();let visible=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));if(!visible.length)list.append(el('div','empty',filter==='done'?'No completed tasks yet.':'Nothing here. Add a task to get started.'));for(const cat of categories){const group=visible.filter(t=>t.category===cat).sort((a,b)=>['High','Normal','Low'].indexOf(a.priority)-['High','Normal','Low'].indexOf(b.priority));if(!group.length)continue;list.append(el('h2','',cat+' · '+group.length));for(const t of group){const row=el('div','task'+(t.done?' done':'')),toggle=el('button','toggle');toggle.setAttribute('aria-label',(t.done?'Reopen ':'Complete ')+t.title);toggle.append(el('span','circle',t.done?'✓':''));const label=el('span','label',t.title);label.append(el('span','sub',t.priority+' priority'));toggle.append(label);toggle.onclick=()=>{t.done=!t.done;save();render()};const edit=el('button','icon','Edit');edit.onclick=()=>{editing=t.id;$('title').value=t.title;$('category').value=t.category;$('priority').value=t.priority;$('form').querySelector('button').textContent='Save changes';$('title').focus()};const del=el('button','icon','Delete');del.onclick=()=>{if(confirm('Delete this task?')){tasks=tasks.filter(x=>x.id!==t.id);if(editing===t.id)reset();save();render()}};row.append(toggle,edit,del);list.append(row)}}}function reset(){editing=null;$('form').reset();$('form').querySelector('button').textContent='Add task'}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});$('form').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title)return;const data={title,category:$('category').value,priority:$('priority').value};if(editing){const t=tasks.find(x=>x.id===editing);if(t)Object.assign(t,data)}else{if(tasks.length>=500){$('notice').textContent='Maximum 500 tasks.';return}tasks.push({id:crypto.randomUUID(),...data,done:false})}reset();save();render()};$('theme').onclick=()=>{const dark=document.body.classList.toggle('dark');try{localStorage.setItem(KEY+':theme',dark?'dark':'light')}catch{}};$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='checklist.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;if(f.size>1000000)throw Error('File too large');const incoming=decode(await f.text());const map=new Map(tasks.map(t=>[t.id,t]));for(const t of incoming){if(!map.has(t.id))map.set(t.id,t)}if(map.size>500)throw Error('Too many tasks');tasks=[...map.values()];save();render();$('notice').textContent='Imported. Existing tasks and completion states preserved.'}catch(e){$('notice').textContent=e.message}finally{$('file').value=''}};render();
</script></body></html>
